apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-monitoring-app
  namespace: ai-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-monitoring-app
  template:
    metadata:
      labels:
        app: ai-monitoring-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: ai-monitoring-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
